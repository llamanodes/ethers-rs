name: deps

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    schedule: [cron: "00 00 * * *"]

concurrency:
  group: pr-ci-deps.yml-${{ github.event_name }}-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
    cargo-deny:
        name: cargo deny check
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v3
            - uses: EmbarkStudios/cargo-deny-action@v1
              with:
                  command: check all
